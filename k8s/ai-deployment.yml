apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-deployment
  labels:
    name: ai-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-server
  template:
    metadata:
      labels:
        app: ai-server
    spec:
      containers:
      - image: ai-orchestration:latest
        imagePullPolicy: IfNotPresent
        name: ai-server
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            # LangChain + LangGraph + Express does not fit in 256Mi.
            # The old limit caused OOMKilled -> CrashLoopBackOff.
            memory: "768Mi"
        env:
          - name: NODE_OPTIONS
            value: "--max-old-space-size=512"
          - name: GEMINI_API_KEY
            valueFrom:
              secretKeyRef:
                name: flowent-secrets
                key: GEMINI_API_KEY
          - name: MISTRAL_API_KEY
            valueFrom:
              secretKeyRef:
                name: flowent-secrets
                key: MISTRAL_API_KEY
        livenessProbe:
          httpGet:
            path: /api/status/healthz
            port: 3000
          initialDelaySeconds: 90
          periodSeconds: 20
          failureThreshold: 6
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/status/healthz
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 12
          timeoutSeconds: 10
        ports:
        - containerPort: 3000
          name: ai-server-port
