apiVersion: apps/v1
kind: Deployment
metadata:
  name:  ai-deployment
  labels:
    name:  ai-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-server
  template:
    metadata:
      labels:
        app:  ai-server
    spec:
      containers:
      - image:  ai-orchestration:latest
        imagePullPolicy: IfNotPresent
        name:  ai-server
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        env:
          - name: GEMINI_API_KEY
            valueFrom:
              secretKeyRef:
                name: flowent-secrets
                key: GEMINI_API_KEY
                optional: true
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: flowent-secrets
                key: OPENAI_API_KEY
                optional: true
        livenessProbe:
          httpGet:
            path: /api/status/healthz
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/status/healthz
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10   
        ports:
        - containerPort:  3000
          name:  ai-server-port
        