apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sandbox-images-cache
  namespace: default
spec:
  selector:
    matchLabels:
      app: sandbox-images-cache
  template:
    metadata:
      labels:
        app: sandbox-images-cache
    spec:
      containers:
        - name: template-pin
          image: docker.io/library/template:latest
          imagePullPolicy: Never
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "20m"
              memory: "32Mi"
        - name: agent-pin
          image: docker.io/library/agent:latest
          imagePullPolicy: Never
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "20m"
              memory: "32Mi"
