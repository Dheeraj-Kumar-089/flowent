apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sandbox-images-cache
  namespace: default
spec:
  selector:
    matchLabels:
      app: sandbox-images-cache
  template:
    metadata:
      labels:
        app: sandbox-images-cache
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: template-pin
          image: 360821545863.dkr.ecr.ap-south-1.amazonaws.com/flowent-template:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "20m"
              memory: "32Mi"
        - name: agent-pin
          image: 360821545863.dkr.ecr.ap-south-1.amazonaws.com/flowent-agent:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "20m"
              memory: "32Mi"
