apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
      - name: auth-server
        image: 360821545863.dkr.ecr.ap-south-1.amazonaws.com/flowent-auth:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: auth-port
        resources:
          requests:
            cpu: "50m"
            memory: "96Mi"
          limits:
            cpu: "300m"
            memory: "320Mi"
        env:
          # Explicit absolute callback URL. Without it passport derives the URL
          # from proxy headers, which silently breaks the Google redirect_uri
          # match if any header is missing.
          - name: GOOGLE_CALLBACK_URL
            value: "https://projectrs.me/api/auth/google/callback"
          - name: PUBLIC_BASE_URL
            value: "https://projectrs.me"
          - name: MONGO_URI
            valueFrom:
              secretKeyRef:
                name: flowent-secrets
                key: MONGO_URI
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: flowent-secrets
                key: JWT_SECRET
          - name: GOOGLE_OAUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: flowent-secrets
                key: GOOGLE_OAUTH_CLIENT_ID
          - name: GOOGLE_OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: flowent-secrets
                key: GOOGLE_OAUTH_CLIENT_SECRET
          - name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: flowent-secrets
                key: REDIS_URL
        livenessProbe:
          httpGet:
            path: /_status/healthz
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 6
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /_status/readyz
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 12
          timeoutSeconds: 10
