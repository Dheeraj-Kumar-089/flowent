apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-deployment
  labels:
    name: sandbox-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-server
  template:
    metadata:
      labels:
        app: sandbox-server
    spec:
      serviceAccountName: resource-manager
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - image: 360821545863.dkr.ecr.ap-south-1.amazonaws.com/flowent-sandbox:latest
          imagePullPolicy: IfNotPresent
          name: main-sandbox-container
          resources:
            limits:
              cpu: "300m"
              memory: "384Mi"
            requests:
              cpu: "50m"
              memory: "96Mi"
          # These were missing entirely, so Redis TTL cleanup, Mongo and JWT
          # verification all ran with undefined config.
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: flowent-secrets
                  key: MONGO_URI
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: flowent-secrets
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: flowent-secrets
                  key: JWT_SECRET
          livenessProbe:
            httpGet:
              path: /api/sandbox/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/sandbox/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 10
          ports:
            - containerPort: 3000
              name: main-sandbox
