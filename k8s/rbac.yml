apiVersion: v1
kind: ServiceAccount
metadata:
  name:  resource-manager     # name of service accout

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: resource-manager
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["create", "get", "list", "watch", "delete"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: resource-manager-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: resource-manager
subjects:
- kind: ServiceAccount
  name: resource-manager

# this file is crating a service account, role and role binding 
# for the resource-manager to create and manage pods and services

# it basically defines the rules to create and manage pods and services