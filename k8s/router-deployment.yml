apiVersion: apps/v1
kind: Deployment
metadata:
  name: router-deployment
  labels:
    name: router-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: router
  template:
    metadata:
      labels:
        app: router
    spec:
      containers:
      - image: router:latest
        imagePullPolicy: IfNotPresent
        name: router-server
        resources:
          requests:
            cpu: "50m"
            memory: "96Mi"
          limits:
            cpu: "300m"
            memory: "320Mi"
        livenessProbe:
          httpGet:
            path: /api/status/healthz
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 6
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/status/readyz
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 12
          timeoutSeconds: 10
        ports:
        - containerPort: 3000
          name: router-http
