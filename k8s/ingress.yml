apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flowent-ingress
  annotations:
    # Time in seconds to wait for a response from the pod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "6000"
    
    # Time in seconds to wait for data to be sent to the pod
    nginx.ingress.kubernetes.io/proxy-send-timeout: "6000"
    
    # Time in seconds to establish a connection to the pod
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "6000"

    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    nginx.ingress.kubernetes.io/session-cookie-path: "/"               # websocket can connect multiple servers. but this line allow to connect only one server at a time

  labels:
    app.kubernetes.io/name: flowent-ingress
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - "3.110.151.177.nip.io"
    - "*.preview.3.110.151.177.nip.io"
    - "*.agent.3.110.151.177.nip.io"
    - "localhost"
    - "*.preview.localhost"
    - "*.agent.localhost"
    secretName: flowent-tls-secret
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: "/api/sandbox"
        backend:
          service:
            name: sandbox-service
            port: 
              number: 80

      - pathType: Prefix
        path: "/api/ai"
        backend:
          service:
            name: ai-service
            port: 
              number: 80

      - pathType: Prefix
        path: "/api/auth"
        backend:
          service:
            name: auth-service
            port: 
              number: 80

      - pathType: Prefix
        path: "/auth"
        backend:
          service:
            name: auth-service
            port: 
              number: 80

      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: frontend-service
            port: 
              number: 80

  - host: "*.preview.localhost"    ## ispe jo req aayega use router service pe forward kr denge
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: router-service
            port: 
              number: 80

  - host: "*.agent.localhost" 
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: router-service
            port: 
              number: 80

  - host: "*.preview.3.110.151.177.nip.io"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: router-service
            port: 
              number: 80

  - host: "*.agent.3.110.151.177.nip.io"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: router-service
            port: 
              number: 80



# it is telling that agar request /api/sandbox pe aayega to use 
# sandbox service pe port 80 pe forward kr dena
