apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flowent-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "6000"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "6000"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"

    # Server-Sent Events from /api/ai/invoke are swallowed by nginx's response
    # buffer until the stream ends. Without these the chat looks frozen.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"

    # AI file writes routinely exceed the 1m default and fail with 413.
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"

    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    nginx.ingress.kubernetes.io/session-cookie-path: "/"

  labels:
    app.kubernetes.io/name: flowent-ingress
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - "13.204.81.229.nip.io"
    - "*.13.204.81.229.nip.io"
    - "*.preview.13.204.81.229.nip.io"
    - "*.agent.13.204.81.229.nip.io"
    - "localhost"
    - "*.preview.localhost"
    - "*.agent.localhost"
    secretName: flowent-tls-secret
  rules:
  # Sandbox preview and agent subdomains must be matched BEFORE the
  # host-less catch-all rule below.
  - host: "*.preview.13.204.81.229.nip.io"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: router-service
            port:
              number: 80

  - host: "*.preview.projectrs.me"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: router-service
            port:
              number: 80

  - host: "*.agent.13.204.81.229.nip.io"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: router-service
            port:
              number: 80

  - host: "*.preview.localhost"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: router-service
            port:
              number: 80

  - host: "*.agent.localhost"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: router-service
            port:
              number: 80

  - http:
      paths:
      - pathType: Prefix
        path: "/api/agent"
        backend:
          service:
            name: router-service
            port:
              number: 80

      - pathType: Prefix
        path: "/api/sandbox"
        backend:
          service:
            name: sandbox-service
            port:
              number: 80

      - pathType: Prefix
        path: "/api/ai"
        backend:
          service:
            name: ai-service
            port:
              number: 80

      - pathType: Prefix
        path: "/api/auth"
        backend:
          service:
            name: auth-service
            port:
              number: 80

      - pathType: Prefix
        path: "/auth"
        backend:
          service:
            name: auth-service
            port:
              number: 80

      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: frontend-service
            port:
              number: 80
